<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="dash.css">
    
</head>
<body id="reset-body">
    <main id="styles_main">
        <h1 id="signup_id">Create an Account</h1>
        <form id="signup-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" required>

            <label for="student-id">Student ID</label>
            <input type="text" id="student-id" name="student-id" required>

            <label for="major">Major</label>
            <input type="text" id="major" name="major" required>

            <button type="submit">Sign Up</button>

            <!-- Popup element -->
            <div class="popup" id="success-popup">
                Account created successfully!
            </div>
        </form>
        
        <p class="login-link">Already have an account? <a href="login.html">Log in</a></p>
    </main>

    <script>
        const signupForm = document.getElementById("signup-form");
        const successPopup = document.getElementById("success-popup");

        signupForm.addEventListener("submit", async (event) => {
            event.preventDefault(); // Prevent form submission

            const formData = new FormData(signupForm); // Get form data
            const formObject = {};
            formData.forEach((value, key) => {
                formObject[key] = value;
            });

            const password = formObject['password'];
            const confirmPassword = formObject['confirm-password'];

            // Check if passwords match
            if (password !== confirmPassword) {
                alert("Passwords do not match");
                return;
            }

            // Check if password has at least 8 characters
            if (password.length < 8) {
                alert("Password must be at least 8 characters long");
                return;
            }

            try {
                const response = await fetch("URL_TO_YOUR_BACKEND_ENDPOINT", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formObject)
                });

                if (response.ok) {
                    successPopup.style.display = "block"; // Display success popup
                    setTimeout(() => {
                        successPopup.style.display = "none"; // Hide popup after 3 seconds
                    }, 3000);
                    const data = await response.json();
                    console.log(data); // Handle successful response from the server
                } else {
                    const errorMessage = await response.text(); // Get error message from response
                    console.error("Failed to sign up:", errorMessage);
                    alert("Failed to sign up: " + errorMessage); // Show error message
                }
            } catch (error) {
                console.error("Error signing up:", error.message);
                alert("Error signing up. Please try again.");
            }
        });
    </script>
</body>
</html>
